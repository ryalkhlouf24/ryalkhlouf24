<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>184192 - Rinad Yaser Ali Al-Khalouf | Contact Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- Navigation menu -->
    <nav>
      <a href="index.html">Home</a>
      <a href="contact.html" class="active">Contact Me</a>
    </nav>

    <section class="card postcard" id="postcard" style="margin-top: 80px;">
      <h2>Contact Me</h2>
      <div class="stamp" aria-hidden="true">🎮</div>
      <p>Write me a message, and I will reply as soon as I can.</p>

      <form id="contactForm" novalidate>
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname">

        <label for="email">Email address</label>
        <input type="email" id="email" name="email">

        <label for="country">Country</label>
        <input type="text" id="country" name="country">

        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="5"></textarea>

        <button type="submit" class="send">Submit</button>
      </form>

      <div class="sent-stamp" aria-hidden="true">SENT!</div>
    </section>

    <footer>
      <p>&copy; 2026 Rinad - Department of Computer Game Design and Development - JUST</p>
    </footer>

  </div>

  <script>
    var form = document.getElementById("contactForm");
    var postcard = document.getElementById("postcard");

    // Runs when the form is submitted
    form.addEventListener("submit", function (event) {
      // Stop the page from reloading
      event.preventDefault();

      // Read each field (trim removes extra spaces)
      var name = document.getElementById("fullname").value.trim();
      var email = document.getElementById("email").value.trim();
      var country = document.getElementById("country").value.trim();
      var comments = document.getElementById("comments").value.trim();

      // Check that all fields are filled in
      if (name === "" || email === "" || country === "" || comments === "") {
        alert("Please fill in all fields before submitting.");
        return;
      }

      // Everything is filled in: show the SENT! stamp, then the alert
      postcard.classList.add("sent");
      setTimeout(function () {
        alert("Thank you, " + name + "! Your form was submitted successfully.");
        form.reset();
        postcard.classList.remove("sent");
      }, 200);
    });
  </script>
</body>
</html>
