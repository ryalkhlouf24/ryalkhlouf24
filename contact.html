<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Rinad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">My Portfolio</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="contact.html" class="active">Contact Me</a></li>
        </ul>
    </nav>

    <div class="container">
        <section class="section form-section">
            <h2>Contact Me</h2>
            <p>Please fill out the form below to get in touch with me.</p>

            <form id="contactForm">
                <div class="form-group">
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" placeholder="Enter your email address">
                </div>

                <div class="form-group">
                    <label for="country">Country:</label>
                    <input type="text" id="country" placeholder="Enter your country">
                </div>

                <div class="form-group">
                    <label for="comments">Comments:</label>
                    <textarea id="comments" rows="5" placeholder="Write your comments here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 Rinad - Department of Computer Information Systems - JUST</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
